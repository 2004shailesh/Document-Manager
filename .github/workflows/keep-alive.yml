name: Keep Backend Alive 24/7
on:
  schedule:
    # Run every 10 minutes (Render spins down after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-backend:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://document-manager-5k5k.onrender.com"
          fi
          echo "Pinging $BACKEND_URL/health to maintain 24/7 uptime..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BACKEND_URL/health" || true)
          echo "Response code: $HTTP_STATUS"
