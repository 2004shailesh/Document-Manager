name: Keep Backend Alive 24/7

on:
  schedule:
    # Run every 8 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/8 * * * *'
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-backend:
    name: Keep Render Backend Awake
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          BACKEND_URL="https://document-manager-cled.onrender.com"
          echo "Pinging $BACKEND_URL/health to maintain 24/7 uptime..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BACKEND_URL/health" || true)
          echo "Response code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Backend is healthy and awake!"
          else
            echo "⚠️ Backend returned status $HTTP_STATUS (or is waking up)"
          fi
