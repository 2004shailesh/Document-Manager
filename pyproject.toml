# ==============================================================================
# 1. BUILD SYSTEM CONFIGURATION (PEP 517 / PEP 518)
# ==============================================================================
# Standardizes build backend requirements. `setuptools>=61.0` supports PEP 621
# natively and works out-of-the-box in all standard environments.
# ==============================================================================
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# ==============================================================================
# 2. PROJECT METADATA (PEP 621)
# ==============================================================================
[project]
name = "document-management-system"
version = "0.1.0"
description = "FastAPI backend service with OCR, SQLModel, and ML classification"
readme = "README.md"
requires-python = ">=3.12"



# Production Runtime Dependencies (aligned with requirements.in / requirements.txt)
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.35",
    "psycopg2-binary>=2.9.9",
    "pymupdf>=1.28.0",
    "rapidocr-onnxruntime>=1.4.0",
    "python-multipart>=0.0.20",
    "pillow>=12.0.0",
    "pwdlib[argon2]>=0.3.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.2",
]

# Development Dependencies (install via `pip install -e .[dev]`)
[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.11.0",
]

# External CLI Command
[project.scripts]
document-server = "src.api.api:run"

# ==============================================================================
# 3. PACKAGE DISCOVERY CONFIGURATION
# ==============================================================================
[tool.setuptools.packages.find]
where = ["backend"]
include = ["src*"]

# ==============================================================================
# 4. CODE FORMATTING (BLACK)
# ==============================================================================
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | frontend
)/
'''

# ==============================================================================
# 5. IMPORT SORTING (ISORT)
# ==============================================================================
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]
src_paths = [".", "backend"]

# ==============================================================================
# 6. STATIC TYPE ANALYSIS (MYPY)
# ==============================================================================
[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
plugins = ["pydantic.mypy"]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
